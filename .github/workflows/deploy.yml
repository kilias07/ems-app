name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build data-ops
        run: pnpm build
        working-directory: packages/data-ops

      - name: Build user-application
        run: pnpm build
        working-directory: apps/user-application

      # D1 migrations are applied manually: wrangler d1 migrations apply DB --remote --config apps/user-application/wrangler.jsonc

      - name: Deploy
        run: npx wrangler deploy
        working-directory: apps/user-application
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
